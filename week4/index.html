<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>나만의 캠퍼스 핫스팟 - Week 4</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
<h1>나만의 캠퍼스 핫스팟</h1>
<p>
가톨릭대학교 성심교정에서 제가 추천하고 싶은
세 곳을 소개합니다.
</p>
</header>

<main>

<section class="place-buttons">
<button type="button" data-place="library">
베리타스관 (중앙도서관)
</button>

<button type="button" data-place="garden">
하늘동산
</button>

<button type="button" data-place="church">
예수성심성당
</button>
</section>

<section class="place-content">

<h2 id="place-title"></h2>

<img
id="place-image"
src=""
alt=""
>

<h3>이 장소를 선택한 이유</h3>
<p id="place-reason"></p>

<h3>장소 소개</h3>
<p id="place-description"></p>

<h3>추천 활동</h3>
<p id="place-activity"></p>

<h3>위치</h3>

<div class="map-container">
<iframe
id="place-map"
src=""
loading="lazy"
referrerpolicy="no-referrer-when-downgrade"
title="장소 위치 지도">
</iframe>
</div>

</section>

</main>

<footer>
<p>가톨릭대학교 웹프로그래밍 Week 4</p>
</footer>

<script src="app.js"></script>

</body>
</html>
