<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>서울 공공자전거 이용 데이터 분석</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Noto Sans KR", sans-serif;
            background-color: #f5f7fa;
            color: #263238;
            line-height: 1.7;
        }

        header {
            background-color: #315f49;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        main {
            width: 90%;
            max-width: 900px;
            margin: 35px auto;
        }

        .chart-section {
            background-color: white;
            padding: 25px;
            margin-bottom: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #315f49;
        }

        .chart-container {
            position: relative;
            width: 100%;
            min-height: 350px;
        }

        .source {
            margin-top: 25px;
            padding: 18px;
            background-color: #e8efea;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            padding: 25px;
            margin-top: 40px;
            background-color: #e3e9e5;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 27px;
            }

            main {
                width: 94%;
            }

            .chart-section {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>서울 공공자전거 이용 데이터 분석</h1>
    <p>서울시 공공자전거 따릉이의 일별 대여 데이터를 분석합니다.</p >
</header>

<main>

    <section class="chart-section">
        <h2>1. 월별 대여량은 어떻게 달라질까?</h2>

        <div class="chart-container">
            <canvas id="monthlyChart"></canvas>
        </div>

        <p id="monthlyExplanation">
            CSV 데이터를 바탕으로 월별 대여량을 비교합니다.
        </p >
    </section>


    <section class="chart-section">
        <h2>2. 대여량이 가장 많았던 날은 언제일까?</h2>

        <div class="chart-container">
            <canvas id="dailyChart"></canvas>
        </div>

        <p id="dailyExplanation">
            일별 데이터를 비교하여 대여량이 많았던 날짜를 확인합니다.
        </p >
    </section>


    <section class="source">
        <h2>데이터 출처</h2>

        <p>
            서울 열린데이터광장<br>
            서울특별시 공공자전거 일별 대여건수 데이터
        </p >
    </section>

</main>

<footer>
    <p>가톨릭대학교 웹프로그래밍 Week 4</p >
</footer>


<script src="statistics.js"></script>

</body>
</html>
