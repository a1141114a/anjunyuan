<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ board_title }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="{{ url_for('comments') }}">{{ board_title }}</a>
      <nav aria-label="계정 메뉴">
        {% if current_user %}
          <span class="current-user">{% if current_user['is_admin'] %}관리자{% else %}{{ current_user['username'] }}님{% endif %}</span>
          {% if current_user['is_admin'] %}<a href="{{ url_for('admin') }}">관리 화면</a>{% endif %}
          <form method="post" action="{{ url_for('logout') }}">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <button class="text-button" type="submit">로그아웃</button>
          </form>
        {% else %}
          <a href="{{ url_for('login') }}">로그인</a>
          <a href="{{ url_for('register') }}">회원가입</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="wrap site-footer">캠퍼스 쉼표 · 웹프로그래밍 7주차 실습 · 실습용 계정으로 함께하는 장소 추천</footer>
</body>
</html>
